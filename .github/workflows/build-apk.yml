name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Signed APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare Single APK Output
        id: prep
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/volleyball-scoreboard.apk
          ls -la dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: volleyball-scoreboard-apk
          path: dist/volleyball-scoreboard.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Beach Volleyball Scoreboard (v1.0.${{ github.run_number }})"
          body: |
            ### 🏐 Beach Volleyball Scoreboard (v1.0.${{ github.run_number }})
            
            - **100% Offline**: Zero internet required.
            - **Serve Indicator**: High-visibility volleyball serve badge (tap badge to toggle server).
            - **Deterministic Scoring**: Single click = +1, Double click (<380ms) = -1 (undo).
          files: dist/volleyball-scoreboard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
