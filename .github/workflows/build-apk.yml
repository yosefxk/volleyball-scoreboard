name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed APK with Gradle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          chmod +x ./gradlew || true
          gradle wrapper
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk-path
        run: |
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          echo "path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: volleyball-scoreboard-apk
          path: ${{ steps.apk-path.outputs.path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Beach Volleyball Scoreboard (v1.0.${{ github.run_number }})"
          body: |
            ### 🏐 Beach Volleyball Scoreboard Update (v1.0.${{ github.run_number }})
            
            - **Serving Indicator**: High-visibility volleyball serve badge (tap badge to toggle server).
            - **Seamless In-Place Updates**: Signed with a permanent keystore so future updates install directly over this app!
            - **Deterministic Scoring**: Single click = +1, Double click (<380ms) = -1 (undo).
          files: ${{ steps.apk-path.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
