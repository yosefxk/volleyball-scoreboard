name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew || true
          gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: volleyball-scoreboard-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Beach Volleyball Scoreboard APK (v1.0.0-${{ github.run_number }})"
          body: |
            ### 🏐 Beach Volleyball Scoreboard - Android APK
            
            This native Android APK intercepts hardware buttons from Bluetooth clickers (like AB Shutter 3) without the Android volume slider appearing!
            
            #### 📱 Direct Download:
            Download **`app-debug.apk`** below, tap to install on your Android device, and connect your remote.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
