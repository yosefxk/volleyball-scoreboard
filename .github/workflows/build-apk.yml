name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed APKs
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          chmod +x ./gradlew || true
          gradle wrapper
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare and Verify APKs
        id: prep
        run: |
          mkdir -p dist
          # Copy release APK if signed
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/volleyball-scoreboard.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/volleyball-scoreboard.apk
          fi
          
          # Also copy debug APK for direct install compatibility
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk || true

          # List output APKs
          ls -la dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: volleyball-scoreboard-apk
          path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Beach Volleyball Scoreboard (v1.0.${{ github.run_number }})"
          body: |
            ### 🏐 Beach Volleyball Scoreboard (v1.0.${{ github.run_number }})
            
            - **Serve Indicator**: High-visibility volleyball serve badge (tap badge to toggle server).
            - **Deterministic Scoring**: Single click = +1, Double click (<380ms) = -1 (undo).
            - **Signed APK**: Download `volleyball-scoreboard.apk` or `app-debug.apk`.
          files: |
            dist/volleyball-scoreboard.apk
            dist/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
