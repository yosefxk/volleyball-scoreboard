name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Next Sequential Version
        id: version
        run: |
          git fetch --tags --force
          HIGHEST_PATCH=$(git tag -l "v1.0.*" | sed 's/v1.0.//' | sort -n | tail -n 1)
          if [ -z "$HIGHEST_PATCH" ]; then
            HIGHEST_PATCH=19
          fi
          NEXT_PATCH=$((HIGHEST_PATCH + 1))
          echo "tag=v1.0.${NEXT_PATCH}" >> $GITHUB_OUTPUT
          echo "build_number=${NEXT_PATCH}" >> $GITHUB_OUTPUT
          echo "Computed release version: v1.0.${NEXT_PATCH} (Build ${NEXT_PATCH})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sync Web Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json sw.js android/app/src/main/assets/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Signed APK
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/scoreboard-signing-key.jks
          fi
          cd android
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare Single APK Output
        id: prep
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/volleyball-scoreboard.apk
          ls -la dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: volleyball-scoreboard-apk
          path: dist/volleyball-scoreboard.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Beach Volleyball Scoreboard (${{ steps.version.outputs.tag }})"
          body: |
            ### 🏐 Beach Volleyball Scoreboard (${{ steps.version.outputs.tag }})
            
            - **100% Offline**: Zero internet required (full Service Worker & Android asset support).
            - **Deterministic Scoring & Hold-to-Undo**: Short tap/press = `+1` point; Hold (`0.55s`) = `-1` point (undo); accidental double-taps are ignored.
            - **Persistent Match & Point Log (`📋 Log`)**: Tracks every game and records the exact timestamp and running score of every point.
            - **3-Option `New Game` Dialog**: Prominent Green **New Game & Save Score**, Red **New Game & Discard Score**, and Grey **Cancel**.
            - **Serve Indicator**: High-visibility volleyball serve badge (auto-updates to scoring team or tap badge to switch server).
          files: dist/volleyball-scoreboard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
