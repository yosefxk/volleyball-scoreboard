<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Beach Volleyball Scoreboard</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- 100% OFFLINE ZERO-DEPENDENCY STYLES (NO CDN / NO INTERNET REQUIRED) -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #FFFFFF;
      font-family: Impact, -apple-system, BlinkMacSystemFont, "Arial Black", "Segoe UI", Roboto, sans-serif;
    }

    /* MAIN CONTAINER: 50/50 HORIZONTAL SPLIT */
    .arena {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* TEAM SECTIONS */
    .team-panel {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    #panel-team1 {
      border-right: 3px solid #1a1a1a;
    }

    /* GIGANTIC OUTDOOR SUNLIGHT NUMBERS */
    .giant-score {
      font-size: min(45vw, 88vh);
      line-height: 0.85;
      font-weight: 900;
      text-align: center;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 10px 35px rgba(0, 0, 0, 0.95);
      transition: transform 0.15s ease-out;
    }

    .score-team1 {
      color: #FAFF00; /* High-Vis Neon Yellow */
    }

    .score-team2 {
      color: #00F0FF; /* High-Vis Neon Cyan */
    }

    /* GLOW & FLASH FEEDBACK LAYERS */
    .glow-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease-out, background-color 0.15s ease-out;
    }

    .flash-pop {
      animation: scorePop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .flash-white {
      opacity: 1 !important;
      background-color: rgba(255, 255, 255, 0.25) !important;
    }

    .flash-red {
      opacity: 1 !important;
      background-color: rgba(220, 38, 38, 0.45) !important;
    }

    @keyframes scorePop {
      0% { transform: scale(0.92); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    /* FLOATING SERVE BADGES */
    .serve-badge {
      position: absolute;
      top: 14px;
      z-index: 30;
      padding: 6px 16px;
      border-radius: 9999px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #000000;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .serve-badge:active {
      transform: scale(0.92);
    }

    #serve-badge-team1 {
      left: 16px;
      background-color: #FAFF00;
    }

    #serve-badge-team2 {
      right: 16px;
      background-color: #00F0FF;
    }

    /* FLOATING RESET BUTTON (Top Center) */
    .reset-btn {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      padding: 6px 18px;
      border-radius: 9999px;
      background-color: rgba(24, 24, 27, 0.85);
      color: #A1A1AA;
      border: 1px solid #3F3F46;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
      transition: background-color 0.15s, color 0.15s, transform 0.1s;
    }

    .reset-btn:hover {
      color: #FFFFFF;
      background-color: rgba(39, 39, 42, 0.95);
    }

    .reset-btn:active {
      transform: translateX(-50%) scale(0.95);
    }

    /* TOAST NOTIFICATION */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
      background-color: rgba(24, 24, 27, 0.95);
      border: 1px solid #FAFF00;
      color: #FAFF00;
      padding: 6px 20px;
      border-radius: 9999px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
    }

    .toast-show {
      opacity: 1 !important;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- FLOATING RESET BUTTON (Top Center) -->
  <button onclick="promptReset()" class="reset-btn">
    Reset Game
  </button>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast">
    <span id="toast-msg">Score updated</span>
  </div>

  <!-- MAIN SCOREBOARD ARENA (Left Half Team A, Right Half Team B) -->
  <main class="arena">

    <!-- TEAM A (LEFT HALF - NEON YELLOW) -->
    <section id="panel-team1" class="team-panel" onclick="handleScreenClick('team1')">
      
      <!-- Serve Indicator Badge (Team A) -->
      <div id="serve-badge-team1" class="serve-badge" onclick="event.stopPropagation(); toggleServer('team2');" title="Click to switch server">
        <span>🏐</span>
        <span>SERVE</span>
      </div>

      <!-- Visual Flash Feedback Layer -->
      <div id="glow-team1" class="glow-layer"></div>
      
      <!-- Massive Score Display -->
      <div id="score-team1" class="giant-score score-team1">
        0
      </div>
    </section>

    <!-- TEAM B (RIGHT HALF - NEON CYAN) -->
    <section id="panel-team2" class="team-panel" onclick="handleScreenClick('team2')">
      
      <!-- Serve Indicator Badge (Team B) -->
      <div id="serve-badge-team2" class="serve-badge hidden" onclick="event.stopPropagation(); toggleServer('team1');" title="Click to switch server">
        <span>🏐</span>
        <span>SERVE</span>
      </div>

      <!-- Visual Flash Feedback Layer -->
      <div id="glow-team2" class="glow-layer"></div>

      <!-- Massive Score Display -->
      <div id="score-team2" class="giant-score score-team2">
        0
      </div>
    </section>

  </main>

  <script>
    /* ==========================================================================
       100% OFFLINE DETERMINISTIC BEACH VOLLEYBALL SCORING ENGINE
       - Zero network requests / Works completely offline
       - Single Click: Exactly +1 (after 380ms)
       - Double Click (<380ms): Exactly -1 (Undo)
       - Cooldown / Debounce: Mathematically blocks cascading +/- glitches
       - Server Indicator: Moves to scoring team or tap to toggle
       ========================================================================== */

    const STORAGE_KEY = 'vb_scores_offline_v3';

    let currentServer = 'team1'; // 'team1' | 'team2'

    // Independent scoring state machine for each team
    const teamState = {
      team1: { score: 0, timer: null, status: 'IDLE' }, // 'IDLE' | 'WAITING' | 'COOLDOWN'
      team2: { score: 0, timer: null, status: 'IDLE' }
    };

    const DOUBLE_CLICK_WINDOW_MS = 380;
    const COOLDOWN_LOCKOUT_MS = 350;

    function init() {
      loadSavedScores();
      renderScores();
      setupKeyboardListeners();
    }

    function loadSavedScores() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          teamState.team1.score = parsed.s1 || 0;
          teamState.team2.score = parsed.s2 || 0;
          currentServer = parsed.srv || 'team1';
        }
      } catch (e) {}
    }

    function saveScores() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          s1: teamState.team1.score,
          s2: teamState.team2.score,
          srv: currentServer
        }));
      } catch (e) {}
    }

    function renderScores() {
      document.getElementById('score-team1').innerText = teamState.team1.score;
      document.getElementById('score-team2').innerText = teamState.team2.score;

      const b1 = document.getElementById('serve-badge-team1');
      const b2 = document.getElementById('serve-badge-team2');
      if (b1 && b2) {
        b1.classList.toggle('hidden', currentServer !== 'team1');
        b2.classList.toggle('hidden', currentServer !== 'team2');
      }
    }

    function toggleServer(newServer) {
      currentServer = newServer;
      saveScores();
      renderScores();
      showToast(`${newServer === 'team1' ? 'Team A' : 'Team B'} is serving`);
      triggerHaptic(30);
    }

    /**
     * Core Scoring Event Handler:
     * Guarantees that each user interaction can ONLY EVER produce:
     * - Exactly +1 (single press)
     * - Exactly -1 (rapid double press)
     */
    function registerScoreEvent(team) {
      const state = teamState[team];

      // 1. If currently in cooldown lockout, ignore bounce or trailing clicks
      if (state.status === 'COOLDOWN') {
        return;
      }

      // 2. If a single click is already pending, this is a DOUBLE CLICK (-1 UNDO)
      if (state.status === 'WAITING') {
        // Cancel the pending +1 timer
        clearTimeout(state.timer);
        state.timer = null;

        // Perform EXACTLY ONE decrement (-1)
        state.score = Math.max(0, state.score - 1);
        saveScores();
        renderScores();
        triggerVisualFeedback(team, 'red');
        triggerHaptic(80);

        // Enter cooldown lockout to prevent trailing clicks from triggering +1
        state.status = 'COOLDOWN';
        setTimeout(() => {
          state.status = 'IDLE';
        }, COOLDOWN_LOCKOUT_MS);
        return;
      }

      // 3. FIRST CLICK (Start waiting for possible double click)
      if (state.status === 'IDLE') {
        state.status = 'WAITING';
        triggerVisualFeedback(team, 'pop');

        state.timer = setTimeout(() => {
          // SINGLE CLICK CONFIRMED (+1)
          state.score += 1;
          currentServer = team; // Serving team becomes who scored!
          saveScores();
          renderScores();
          triggerHaptic(40);

          state.timer = null;
          state.status = 'COOLDOWN';
          setTimeout(() => {
            state.status = 'IDLE';
          }, 80);
        }, DOUBLE_CLICK_WINDOW_MS);
      }
    }

    /* Screen Tap Handler */
    function handleScreenClick(team) {
      registerScoreEvent(team);
    }

    /* Native Android Remote Key Handler (called from MainActivity) */
    window.handleRemoteClick = function(team) {
      registerScoreEvent(team);
    };

    /* Keyboard / Web Fallback */
    function setupKeyboardListeners() {
      window.addEventListener('keydown', (e) => {
        if (e.repeat) return; // Ignore auto-repeat keydown

        const code = e.code || e.key;
        if (['ArrowLeft', 'KeyA', 'Enter', 'PageUp', 'AudioVolumeUp'].includes(code)) {
          e.preventDefault();
          registerScoreEvent('team1');
        } else if (['ArrowRight', 'KeyB', 'Space', 'PageDown', 'AudioVolumeDown'].includes(code)) {
          e.preventDefault();
          registerScoreEvent('team2');
        } else if (code === 'KeyR') {
          promptReset();
        } else if (code === 'KeyS') {
          toggleServer(currentServer === 'team1' ? 'team2' : 'team1');
        }
      });
    }

    /* Visual Pulse & Color Feedback */
    function triggerVisualFeedback(team, type) {
      const scoreEl = document.getElementById(`score-${team}`);
      const glowEl = document.getElementById(`glow-${team}`);

      if (scoreEl) {
        scoreEl.classList.remove('flash-pop');
        void scoreEl.offsetWidth; // Force DOM reflow
        scoreEl.classList.add('flash-pop');
      }

      if (glowEl) {
        if (type === 'red') {
          glowEl.className = 'glow-layer flash-red';
          setTimeout(() => {
            glowEl.className = 'glow-layer';
          }, 250);
        } else {
          glowEl.className = 'glow-layer flash-white';
          setTimeout(() => {
            glowEl.className = 'glow-layer';
          }, 120);
        }
      }
    }

    function triggerHaptic(duration) {
      if (window.AndroidNative && window.AndroidNative.vibrate) {
        window.AndroidNative.vibrate(duration);
      } else if ('vibrate' in navigator) {
        navigator.vibrate(duration);
      }
    }

    function promptReset() {
      if (confirm("Reset score to 0 - 0?")) {
        // Clear pending timers
        clearTimeout(teamState.team1.timer);
        clearTimeout(teamState.team2.timer);
        teamState.team1.timer = null;
        teamState.team2.timer = null;
        teamState.team1.status = 'IDLE';
        teamState.team2.status = 'IDLE';

        teamState.team1.score = 0;
        teamState.team2.score = 0;
        currentServer = 'team1';
        saveScores();
        renderScores();
        showToast("Score reset to 0 - 0");
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-msg');
      if (toast && text) {
        text.innerText = msg;
        toast.classList.add('toast-show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
          toast.classList.remove('toast-show');
        }, 1500);
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
