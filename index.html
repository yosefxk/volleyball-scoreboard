<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Beach Volleyball Scoreboard</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- 100% OFFLINE ZERO-DEPENDENCY STYLES (NO CDN / NO INTERNET REQUIRED) -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #FFFFFF;
      font-family: Impact, -apple-system, BlinkMacSystemFont, "Arial Black", "Segoe UI", Roboto, sans-serif;
    }

    /* MAIN CONTAINER: 50/50 HORIZONTAL SPLIT */
    .arena {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* TEAM SECTIONS */
    .team-panel {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      touch-action: none;
    }

    #panel-team1 {
      border-right: 3px solid #1a1a1a;
    }

    /* GIGANTIC OUTDOOR SUNLIGHT NUMBERS */
    .giant-score {
      font-size: min(45vw, 88vh);
      line-height: 0.85;
      font-weight: 900;
      text-align: center;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 10px 35px rgba(0, 0, 0, 0.95);
      transition: transform 0.15s ease-out;
      pointer-events: none;
    }

    .score-team1 {
      color: #FAFF00; /* High-Vis Neon Yellow */
    }

    .score-team2 {
      color: #00F0FF; /* High-Vis Neon Cyan */
    }

    /* HOLD PROGRESS BAR (Shows during long-press to -1) */
    .hold-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 6px;
      width: 0%;
      background: linear-gradient(90deg, #ef4444, #f97316);
      pointer-events: none;
      opacity: 0;
      z-index: 25;
    }

    .hold-active {
      opacity: 1;
      width: 100%;
      transition: width 0.55s linear;
    }

    /* GLOW & FLASH FEEDBACK LAYERS */
    .glow-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease-out, background-color 0.15s ease-out;
    }

    .flash-pop {
      animation: scorePop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .flash-white {
      opacity: 1 !important;
      background-color: rgba(255, 255, 255, 0.25) !important;
    }

    .flash-red {
      opacity: 1 !important;
      background-color: rgba(220, 38, 38, 0.45) !important;
    }

    @keyframes scorePop {
      0% { transform: scale(0.92); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    /* FLOATING SERVE BADGES */
    .serve-badge {
      position: absolute;
      top: 14px;
      z-index: 30;
      padding: 6px 16px;
      border-radius: 9999px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #000000;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .serve-badge:active {
      transform: scale(0.92);
    }

    #serve-badge-team1 {
      left: 16px;
      background-color: #FAFF00;
    }

    #serve-badge-team2 {
      right: 16px;
      background-color: #00F0FF;
    }

    /* TOP CENTER CONTROLS BAR (Reset + Match Log) */
    .top-controls {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-btn {
      padding: 6px 16px;
      border-radius: 9999px;
      background-color: rgba(24, 24, 27, 0.88);
      color: #A1A1AA;
      border: 1px solid #3F3F46;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
      transition: background-color 0.15s, color 0.15s, transform 0.1s, border-color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .ctrl-btn:hover {
      color: #FFFFFF;
      background-color: rgba(39, 39, 42, 0.95);
    }

    .ctrl-btn:active {
      transform: scale(0.95);
    }

    .log-count-pill {
      background-color: #27272A;
      color: #FAFF00;
      padding: 1px 6px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 900;
    }

    /* MATCH LOG MODAL OVERLAY */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .modal-card {
      width: 100%;
      max-width: 760px;
      max-height: 92vh;
      background-color: #121215;
      border: 1px solid #27272A;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95);
      touch-action: pan-y;
    }

    .modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid #27272A;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #18181B;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-btn {
      padding: 5px 12px;
      border-radius: 8px;
      background-color: #27272A;
      color: #E4E4E7;
      border: 1px solid #3F3F46;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .modal-btn-accent {
      background-color: #FAFF00;
      color: #000000;
      border-color: #FAFF00;
    }

    .log-file-banner {
      background-color: #18181B;
      border: 1px solid #27272A;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 11px;
      color: #A1A1AA;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    .log-file-banner strong {
      color: #FAFF00;
      font-family: monospace;
      font-size: 12px;
    }

    .modal-btn-danger {
      color: #FCA5A5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .modal-body {
      padding: 12px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      overscroll-behavior: contain;
    }

    .game-card {
      background-color: #18181B;
      border: 1px solid #27272A;
      border-radius: 12px;
      overflow: hidden;
    }

    .game-card.live-game {
      border-color: rgba(250, 255, 0, 0.45);
    }

    .game-summary {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      gap: 12px;
    }

    .game-summary:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }

    .game-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .game-label {
      font-size: 12px;
      font-weight: 800;
      color: #E4E4E7;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-pill {
      background-color: rgba(250, 255, 0, 0.15);
      color: #FAFF00;
      border: 1px solid rgba(250, 255, 0, 0.4);
      padding: 1px 6px;
      border-radius: 9999px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .game-submeta {
      font-size: 11px;
      color: #71717A;
    }

    .game-final-score {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .t1-text { color: #FAFF00; }
    .t2-text { color: #00F0FF; }
    .score-sep { color: #52525B; font-size: 15px; }

    .points-timeline {
      border-top: 1px solid #27272A;
      background-color: #0E0E11;
      padding: 10px 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 6px;
      touch-action: pan-y;
    }

    .point-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
      font-variant-numeric: tabular-nums;
      touch-action: pan-y;
    }

    .point-idx {
      color: #71717A;
      font-weight: 700;
      min-width: 36px;
    }

    .point-team {
      font-weight: 800;
      flex: 1;
    }

    .point-score {
      font-weight: 900;
      margin: 0 12px;
      color: #E4E4E7;
    }

    .point-time {
      color: #A1A1AA;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .empty-log {
      text-align: center;
      padding: 32px 16px;
      color: #71717A;
      font-size: 13px;
    }

    /* NEW GAME MODAL DIALOG */
    .newgame-card {
      width: 100%;
      max-width: 440px;
      background-color: #121215;
      border: 1px solid #27272A;
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
    }

    .newgame-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #FFFFFF;
      text-align: center;
    }

    .newgame-subtitle {
      font-size: 13px;
      color: #A1A1AA;
      text-align: center;
      font-weight: 600;
      margin-top: -6px;
    }

    .newgame-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .ng-btn {
      width: 100%;
      border-radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease, filter 0.15s ease;
    }

    .ng-btn:active {
      transform: scale(0.97);
    }

    /* Prominent, larger Green button: New Game & Save Score */
    .ng-btn-save {
      padding: 18px 20px;
      font-size: 16px;
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      color: #FFFFFF;
      border: 2px solid #22c55e;
      box-shadow: 0 6px 24px rgba(34, 197, 94, 0.35);
    }

    .ng-btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    /* Smaller Red button: New Game & Discard Score */
    .ng-btn-discard {
      flex: 1.25;
      padding: 12px 14px;
      font-size: 12px;
      background-color: rgba(220, 38, 38, 0.2);
      color: #FCA5A5;
      border: 1px solid #ef4444;
    }

    /* Smaller Grey button: Cancel */
    .ng-btn-cancel {
      flex: 1;
      padding: 12px 14px;
      font-size: 12px;
      background-color: #27272A;
      color: #D4D4D8;
      border: 1px solid #52525B;
    }

    /* TOAST NOTIFICATION */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
      background-color: rgba(24, 24, 27, 0.95);
      border: 1px solid #FAFF00;
      color: #FAFF00;
      padding: 6px 20px;
      border-radius: 9999px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
    }

    .toast-show {
      opacity: 1 !important;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- TOP CENTER CONTROLS (New Game + Match History Log) -->
  <div class="top-controls">
    <button id="btn-reset" onclick="promptNewGame()" class="ctrl-btn" title="Start a new game">
      <span>New Game</span>
    </button>
    <button id="btn-history" onclick="toggleHistoryModal(true)" class="ctrl-btn" title="View all games and point-by-point timestamps">
      <span>📋 Log</span>
      <span id="log-count-badge" class="log-count-pill">0</span>
    </button>
  </div>

  <!-- NEW GAME 3-OPTION MODAL -->
  <div id="newgame-modal" class="modal-backdrop hidden" onclick="if (event.target === this) toggleNewGameModal(false)">
    <div class="newgame-card">
      <div class="newgame-title">Start New Game?</div>
      <div id="newgame-score-summary" class="newgame-subtitle">Current Score: 0 - 0</div>
      <div class="newgame-actions">
        <button onclick="confirmNewGame(true)" class="ng-btn ng-btn-save">
          <span>✓ New Game &amp; Save Score</span>
        </button>
        <div class="ng-btn-row">
          <button onclick="toggleNewGameModal(false)" class="ng-btn ng-btn-cancel">
            <span>Cancel</span>
          </button>
          <button onclick="confirmNewGame(false)" class="ng-btn ng-btn-discard">
            <span>✕ New Game &amp; Discard Score</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- MATCH & POINT HISTORY MODAL -->
  <div id="history-modal" class="modal-backdrop hidden" onclick="if (event.target === this) toggleHistoryModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <span>🏐 Match &amp; Point Log</span>
        </div>
        <div class="modal-actions">
          <button onclick="openLogFile()" class="modal-btn modal-btn-accent" title="Open the log file on your device">📁 View File</button>
          <button onclick="shareLogFile()" class="modal-btn" title="Share the log file via WhatsApp, Email, or Quick Share">Share ↗</button>
          <button onclick="toggleHistoryModal(false)" class="modal-btn">Close ✕</button>
        </div>
      </div>
      <div id="history-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast">
    <span id="toast-msg">Score updated</span>
  </div>

  <!-- MAIN SCOREBOARD ARENA (Left Half Team A, Right Half Team B) -->
  <main class="arena">

    <!-- TEAM A (LEFT HALF - NEON YELLOW) -->
    <section id="panel-team1" class="team-panel">
      
      <!-- Serve Indicator Badge (Team A) -->
      <div id="serve-badge-team1" class="serve-badge"
           onpointerdown="event.stopPropagation();"
           onclick="event.stopPropagation(); toggleServer('team2');"
           title="Tap to switch server">
        <span>🏐</span>
        <span>SERVE</span>
      </div>

      <!-- Visual Flash Feedback Layer -->
      <div id="glow-team1" class="glow-layer"></div>
      <div id="hold-team1" class="hold-progress"></div>
      
      <!-- Massive Score Display -->
      <div id="score-team1" class="giant-score score-team1">
        0
      </div>
    </section>

    <!-- TEAM B (RIGHT HALF - NEON CYAN) -->
    <section id="panel-team2" class="team-panel">
      
      <!-- Serve Indicator Badge (Team B) -->
      <div id="serve-badge-team2" class="serve-badge hidden"
           onpointerdown="event.stopPropagation();"
           onclick="event.stopPropagation(); toggleServer('team1');"
           title="Tap to switch server">
        <span>🏐</span>
        <span>SERVE</span>
      </div>

      <!-- Visual Flash Feedback Layer -->
      <div id="glow-team2" class="glow-layer"></div>
      <div id="hold-team2" class="hold-progress"></div>

      <!-- Massive Score Display -->
      <div id="score-team2" class="giant-score score-team2">
        0
      </div>
    </section>

  </main>

  <script>
    /* ==========================================================================
       100% OFFLINE DETERMINISTIC BEACH VOLLEYBALL SCORING ENGINE
       - Short Tap / Click: +1 Point (Double-tap ignored via 450ms lockout)
       - Hold (>= 550ms):   -1 Point (Decrements score & removes team's last point)
       - Reset Game:        Archives finished game with full point-by-point timestamps
       ========================================================================== */

    const STORAGE_KEY = 'vb_scores_offline_v4';
    const HISTORY_STORAGE_KEY = 'vb_games_history_v1';

    const HOLD_DURATION_MS = 550;       // Holding button/screen for 550ms decreases score by 1
    const POST_ACTION_COOLDOWN_MS = 450; // Ignores second tap of a double-tap!

    let currentServer = 'team1'; // 'team1' | 'team2'
    let currentGameStartedAt = null;
    let currentPointsLog = [];   // Array of { id, team, score1, score2, prevServer, timestamp, timeStr }
    let gamesArchive = [];       // Array of archived games: { id, gameNumber, startedAt, endedAt, finalScore1, finalScore2, points: [...] }

    // Per-team press/hold state machine
    const teamState = {
      team1: { score: 0, isPressed: false, holdFired: false, holdTimer: null, lastActionAt: 0 },
      team2: { score: 0, isPressed: false, holdFired: false, holdTimer: null, lastActionAt: 0 }
    };

    function logToFile(tag, msg) {
      try {
        if (window.AndroidNative && window.AndroidNative.log) {
          window.AndroidNative.log(tag, msg);
        } else {
          console.log(`[${tag}] ${msg}`);
        }
      } catch (e) {}
    }

    function openLogFile() {
      try {
        if (window.AndroidNative && window.AndroidNative.openLog) {
          window.AndroidNative.openLog();
        } else {
          showToast("Log file: Download/volleyball-scoreboard.log");
        }
      } catch (e) {
        showToast("Log file: Download/volleyball-scoreboard.log");
      }
    }

    function shareLogFile() {
      try {
        if (window.AndroidNative && window.AndroidNative.shareLog) {
          window.AndroidNative.shareLog();
        } else {
          showToast("Log file: Download/volleyball-scoreboard.log");
        }
      } catch (e) {
        showToast("Log file: Download/volleyball-scoreboard.log");
      }
    }

    function init() {
      loadSavedState();
      renderScores();
      setupPointerListeners();
      setupKeyboardListeners();
      logToFile("INIT", `App ready. Score: ${teamState.team1.score} - ${teamState.team2.score}. Server: ${currentServer}`);
    }

    function formatClockTime(isoOrDate) {
      const d = isoOrDate ? new Date(isoOrDate) : new Date();
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    }

    function formatDateTimeShort(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + formatClockTime(d);
    }

    function loadSavedState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          teamState.team1.score = parsed.s1 || 0;
          teamState.team2.score = parsed.s2 || 0;
          currentServer = parsed.srv || 'team1';
          currentGameStartedAt = parsed.startedAt || null;
          currentPointsLog = Array.isArray(parsed.pointsLog) ? parsed.pointsLog : [];
        } else {
          // Migrate v3 scores if present
          const legacy = localStorage.getItem('vb_scores_offline_v3');
          if (legacy) {
            const parsedLegacy = JSON.parse(legacy);
            teamState.team1.score = parsedLegacy.s1 || 0;
            teamState.team2.score = parsedLegacy.s2 || 0;
            currentServer = parsedLegacy.srv || 'team1';
          }
        }
      } catch (e) {}

      try {
        const savedHistory = localStorage.getItem(HISTORY_STORAGE_KEY);
        if (savedHistory) {
          const parsedHistory = JSON.parse(savedHistory);
          if (Array.isArray(parsedHistory)) {
            gamesArchive = parsedHistory;
          }
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          s1: teamState.team1.score,
          s2: teamState.team2.score,
          srv: currentServer,
          startedAt: currentGameStartedAt,
          pointsLog: currentPointsLog
        }));
      } catch (e) {}

      try {
        localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(gamesArchive));
      } catch (e) {}
    }

    function renderScores() {
      document.getElementById('score-team1').innerText = teamState.team1.score;
      document.getElementById('score-team2').innerText = teamState.team2.score;

      const b1 = document.getElementById('serve-badge-team1');
      const b2 = document.getElementById('serve-badge-team2');
      if (b1 && b2) {
        b1.classList.toggle('hidden', currentServer !== 'team1');
        b2.classList.toggle('hidden', currentServer !== 'team2');
      }

      const logBadge = document.getElementById('log-count-badge');
      if (logBadge) {
        const activeCount = (teamState.team1.score > 0 || teamState.team2.score > 0 || currentPointsLog.length > 0) ? 1 : 0;
        logBadge.innerText = gamesArchive.length + activeCount;
      }
    }

    function toggleServer(newServer) {
      currentServer = newServer;
      saveState();
      renderScores();
      showToast(`${newServer === 'team1' ? 'Team A' : 'Team B'} is serving`);
      triggerHaptic(30);
      logToFile("SERVER", `Server changed to ${newServer === 'team1' ? 'Team A (Yellow)' : 'Team B (Cyan)'}`);
    }

    function setHoldProgress(team, active) {
      const bar = document.getElementById(`hold-${team}`);
      if (!bar) return;
      if (active) {
        bar.classList.remove('hold-active');
        void bar.offsetWidth;
        bar.classList.add('hold-active');
      } else {
        bar.classList.remove('hold-active');
      }
    }

    /**
     * Press & Hold State Machine:
     * - Press starts a 550ms hold timer.
     * - If held for >= 550ms -> Decreases score by 1 (-1) immediately while held.
     * - If released before 550ms -> Increases score by 1 (+1), UNLESS within the
     *   450ms post-action cooldown window (so double-tapping a button does nothing!).
     */
    function handlePressStart(team) {
      const state = teamState[team];
      if (state.isPressed) return;

      const now = Date.now();
      // Ignore rapid second tap (double-tap does nothing)
      if (now - state.lastActionAt < POST_ACTION_COOLDOWN_MS) {
        return;
      }

      state.isPressed = true;
      state.holdFired = false;
      setHoldProgress(team, true);

      clearTimeout(state.holdTimer);
      state.holdTimer = setTimeout(() => {
        if (!state.isPressed) return;
        state.holdFired = true;
        state.lastActionAt = Date.now();
        setHoldProgress(team, false);
        decrementTeamScore(team);
      }, HOLD_DURATION_MS);
    }

    function handlePressEnd(team) {
      const state = teamState[team];
      if (!state.isPressed) return;

      clearTimeout(state.holdTimer);
      state.holdTimer = null;
      state.isPressed = false;
      setHoldProgress(team, false);

      // If hold already triggered -1, do nothing on release
      if (state.holdFired) {
        state.holdFired = false;
        return;
      }

      const now = Date.now();
      if (now - state.lastActionAt < POST_ACTION_COOLDOWN_MS) {
        return;
      }

      state.lastActionAt = now;
      incrementTeamScore(team);
    }

    function handlePressCancel(team) {
      const state = teamState[team];
      clearTimeout(state.holdTimer);
      state.holdTimer = null;
      state.isPressed = false;
      state.holdFired = false;
      setHoldProgress(team, false);
    }

    function incrementTeamScore(team) {
      const state = teamState[team];
      const nowIso = new Date().toISOString();
      if (!currentGameStartedAt) {
        currentGameStartedAt = nowIso;
      }

      const prevServer = currentServer;
      state.score += 1;
      currentServer = team; // Serving team becomes who scored

      currentPointsLog.push({
        id: Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        team: team,
        score1: teamState.team1.score,
        score2: teamState.team2.score,
        prevServer: prevServer,
        timestamp: nowIso,
        timeStr: formatClockTime(nowIso)
      });

      saveState();
      renderScores();
      triggerVisualFeedback(team, 'pop');
      triggerHaptic(40);
      logToFile("POINT", `${team === 'team1' ? 'Team A (Yellow)' : 'Team B (Cyan)'} scored (+1). Score is now: Team A ${teamState.team1.score} - ${teamState.team2.score} Team B. Server: ${currentServer === 'team1' ? 'Team A' : 'Team B'}`);
    }

    function decrementTeamScore(team) {
      const state = teamState[team];
      if (state.score <= 0) {
        triggerVisualFeedback(team, 'red');
        triggerHaptic(60);
        showToast(`${team === 'team1' ? 'Team A' : 'Team B'} is already at 0`);
        return;
      }

      state.score -= 1;

      // Remove the most recent point scored by this team from the current game's point log
      for (let i = currentPointsLog.length - 1; i >= 0; i--) {
        if (currentPointsLog[i].team === team) {
          const removed = currentPointsLog.splice(i, 1)[0];
          // If this was the very last point scored in the game, restore prior server
          if (i === currentPointsLog.length && removed.prevServer) {
            currentServer = removed.prevServer;
          }
          // Recalculate running score1/score2 on any subsequent points in the log
          let s1 = 0;
          let s2 = 0;
          for (let j = 0; j < currentPointsLog.length; j++) {
            if (currentPointsLog[j].team === 'team1') s1++;
            else s2++;
            currentPointsLog[j].score1 = s1;
            currentPointsLog[j].score2 = s2;
          }
          break;
        }
      }

      saveState();
      renderScores();
      triggerVisualFeedback(team, 'red');
      triggerHaptic(90);
      showToast(`${team === 'team1' ? 'Team A' : 'Team B'} -1 point`);
      logToFile("UNDO", `${team === 'team1' ? 'Team A (Yellow)' : 'Team B (Cyan)'} hold detected -> (-1 UNDO). Score is now: Team A ${teamState.team1.score} - ${teamState.team2.score} Team B. Server: ${currentServer === 'team1' ? 'Team A' : 'Team B'}`);
    }

    /* Pointer Listeners for Touch / Mouse on Both Team Panels */
    function setupPointerListeners() {
      ['team1', 'team2'].forEach((team) => {
        const panel = document.getElementById(`panel-${team}`);
        if (!panel) return;

        panel.addEventListener('pointerdown', (e) => {
          if (e.button !== undefined && e.button !== 0) return;
          e.preventDefault();
          handlePressStart(team);
        });

        panel.addEventListener('pointerup', (e) => {
          e.preventDefault();
          handlePressEnd(team);
        });

        panel.addEventListener('pointercancel', () => {
          handlePressCancel(team);
        });

        panel.addEventListener('pointerleave', () => {
          handlePressCancel(team);
        });

        panel.addEventListener('contextmenu', (e) => {
          e.preventDefault();
        });
      });
    }

    /* Native Android Remote Key Handlers (called from MainActivity.kt) */
    window.handleRemoteKeyDown = function(team) {
      handlePressStart(team);
    };

    window.handleRemoteKeyUp = function(team) {
      handlePressEnd(team);
    };

    /* Legacy fallback if older native APK calls handleRemoteClick */
    window.handleRemoteClick = function(team) {
      handlePressStart(team);
      setTimeout(() => handlePressEnd(team), 50);
    };

    /* Keyboard / Bluetooth Remote Web Listeners */
    function setupKeyboardListeners() {
      const team1Keys = ['ArrowLeft', 'KeyA', 'Enter', 'PageUp', 'VolumeUp', 'AudioVolumeUp'];
      const team2Keys = ['ArrowRight', 'KeyB', 'Space', 'PageDown', 'VolumeDown', 'AudioVolumeDown'];

      window.addEventListener('keydown', (e) => {
        // Ignore if modal is open and user presses Escape
        if (e.key === 'Escape') {
          toggleHistoryModal(false);
          toggleNewGameModal(false);
          return;
        }
        if (e.repeat) return; // Ignore OS key-repeat events while holding

        if (team1Keys.includes(e.code) || team1Keys.includes(e.key)) {
          e.preventDefault();
          document.activeElement?.blur();
          handlePressStart('team1');
        } else if (team2Keys.includes(e.code) || team2Keys.includes(e.key)) {
          e.preventDefault();
          document.activeElement?.blur();
          handlePressStart('team2');
        } else if (e.code === 'KeyR' || e.key === 'r' || e.key === 'R' || e.code === 'KeyN' || e.key === 'n' || e.key === 'N') {
          promptNewGame();
        } else if (e.code === 'KeyS' || e.key === 's' || e.key === 'S') {
          toggleServer(currentServer === 'team1' ? 'team2' : 'team1');
        } else if (e.code === 'KeyL' || e.key === 'l' || e.key === 'L') {
          toggleHistoryModal();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (team1Keys.includes(e.code) || team1Keys.includes(e.key)) {
          e.preventDefault();
          handlePressEnd('team1');
        } else if (team2Keys.includes(e.code) || team2Keys.includes(e.key)) {
          e.preventDefault();
          handlePressEnd('team2');
        }
      });
    }

    /* Visual Pulse & Color Feedback */
    function triggerVisualFeedback(team, type) {
      const scoreEl = document.getElementById(`score-${team}`);
      const glowEl = document.getElementById(`glow-${team}`);

      if (scoreEl) {
        scoreEl.classList.remove('flash-pop');
        void scoreEl.offsetWidth; // Force DOM reflow
        scoreEl.classList.add('flash-pop');
      }

      if (glowEl) {
        if (type === 'red') {
          glowEl.className = 'glow-layer flash-red';
          setTimeout(() => {
            glowEl.className = 'glow-layer';
          }, 280);
        } else {
          glowEl.className = 'glow-layer flash-white';
          setTimeout(() => {
            glowEl.className = 'glow-layer';
          }, 120);
        }
      }
    }

    function triggerHaptic(duration) {
      if (window.AndroidNative && window.AndroidNative.vibrate) {
        window.AndroidNative.vibrate(duration);
      } else if ('vibrate' in navigator) {
        navigator.vibrate(duration);
      }
    }

    function promptNewGame() {
      document.activeElement?.blur();
      handlePressCancel('team1');
      handlePressCancel('team2');
      toggleNewGameModal(true);
    }

    function toggleNewGameModal(forceState) {
      document.activeElement?.blur();
      const modal = document.getElementById('newgame-modal');
      if (!modal) return;
      const shouldOpen = forceState !== undefined ? forceState : modal.classList.contains('hidden');
      if (shouldOpen) {
        const sub = document.getElementById('newgame-score-summary');
        if (sub) {
          sub.innerText = `Current Score: ${teamState.team1.score} - ${teamState.team2.score} (${currentPointsLog.length} points)`;
        }
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function confirmNewGame(saveScore) {
      handlePressCancel('team1');
      handlePressCancel('team2');

      const hasScoreOrPoints = teamState.team1.score > 0 || teamState.team2.score > 0 || currentPointsLog.length > 0;

      if (saveScore && hasScoreOrPoints) {
        const nowIso = new Date().toISOString();
        gamesArchive.unshift({
          id: 'game-' + Date.now(),
          gameNumber: gamesArchive.length + 1,
          startedAt: currentGameStartedAt || (currentPointsLog[0] && currentPointsLog[0].timestamp) || nowIso,
          endedAt: nowIso,
          finalScore1: teamState.team1.score,
          finalScore2: teamState.team2.score,
          points: currentPointsLog.slice()
        });
      }

      teamState.team1.score = 0;
      teamState.team2.score = 0;
      currentServer = 'team1';
      currentGameStartedAt = null;
      currentPointsLog = [];

      saveState();
      renderScores();
      renderHistoryModal();
      toggleNewGameModal(false);
      triggerHaptic(50);

      if (saveScore) {
        showToast(hasScoreOrPoints ? "Game saved to Log & new game started" : "New game started (0 - 0)");
        logToFile("NEW_GAME", `New game confirmed (Score was saved to history: ${hasScoreOrPoints}). Score reset to 0 - 0`);
      } else {
        showToast("Score discarded & new game started");
        logToFile("NEW_GAME", `New game confirmed (Score discarded). Score reset to 0 - 0`);
      }
    }

    function toggleHistoryModal(forceState) {
      document.activeElement?.blur();
      const modal = document.getElementById('history-modal');
      if (!modal) return;
      const shouldOpen = forceState !== undefined ? forceState : modal.classList.contains('hidden');
      if (shouldOpen) {
        renderHistoryModal();
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function toggleGameCardDetails(cardId) {
      const el = document.getElementById(cardId);
      if (el) {
        el.classList.toggle('hidden');
      }
    }

    function renderPointsListHtml(points) {
      if (!points || points.length === 0) {
        return `<div style="color:#71717A;font-size:12px;padding:4px 0;">No points recorded yet.</div>`;
      }
      return points.map((pt, idx) => {
        const isTeam1 = pt.team === 'team1';
        const teamName = isTeam1 ? 'Team A (Yellow)' : 'Team B (Cyan)';
        const teamClass = isTeam1 ? 't1-text' : 't2-text';
        const timeDisplay = pt.timeStr || formatClockTime(pt.timestamp);
        return `
          <div class="point-row">
            <span class="point-idx">#${idx + 1}</span>
            <span class="point-team ${teamClass}">${teamName}</span>
            <span class="point-score">${pt.score1} - ${pt.score2}</span>
            <span class="point-time">🕒 ${timeDisplay}</span>
          </div>
        `;
      }).join('');
    }

    function renderHistoryModal() {
      const container = document.getElementById('history-modal-body');
      if (!container) return;

      const hasCurrentGame = teamState.team1.score > 0 || teamState.team2.score > 0 || currentPointsLog.length > 0;
      let html = `
        <div class="log-file-banner">
          <div>📁 Saved to device: <strong>Download/volleyball-scoreboard.log</strong></div>
          <div style="font-size:10px;color:#71717A;">(Samsung My Files &gt; Downloads)</div>
        </div>
      `;

      if (hasCurrentGame) {
        const startedStr = formatDateTimeShort(currentGameStartedAt || (currentPointsLog[0] && currentPointsLog[0].timestamp));
        html += `
          <div class="game-card live-game">
            <div class="game-summary" onclick="toggleGameCardDetails('pts-current')">
              <div class="game-meta">
                <div class="game-label">
                  <span>Game #${gamesArchive.length + 1}</span>
                  <span class="live-pill">In Progress</span>
                </div>
                <div class="game-submeta">Started ${startedStr} · ${currentPointsLog.length} points logged (tap to expand/collapse)</div>
              </div>
              <div class="game-final-score">
                <span class="t1-text">${teamState.team1.score}</span>
                <span class="score-sep">-</span>
                <span class="t2-text">${teamState.team2.score}</span>
              </div>
            </div>
            <div id="pts-current" class="points-timeline">
              ${renderPointsListHtml(currentPointsLog)}
            </div>
          </div>
        `;
      }

      gamesArchive.forEach((game, index) => {
        const timelineId = `pts-archive-${index}`;
        const startStr = formatDateTimeShort(game.startedAt);
        const endStr = formatClockTime(game.endedAt);
        const pointCount = Array.isArray(game.points) ? game.points.length : 0;
        const isFirst = !hasCurrentGame && index === 0;

        html += `
          <div class="game-card">
            <div class="game-summary" onclick="toggleGameCardDetails('${timelineId}')">
              <div class="game-meta">
                <div class="game-label">
                  <span>Game #${game.gameNumber || (gamesArchive.length - index)}</span>
                </div>
                <div class="game-submeta">${startStr} – ${endStr} · ${pointCount} points (tap to view timeline)</div>
              </div>
              <div class="game-final-score">
                <span class="t1-text">${game.finalScore1}</span>
                <span class="score-sep">-</span>
                <span class="t2-text">${game.finalScore2}</span>
              </div>
            </div>
            <div id="${timelineId}" class="points-timeline ${isFirst ? '' : 'hidden'}">
              ${renderPointsListHtml(game.points)}
            </div>
          </div>
        `;
      });

      if (!html) {
        html = `<div class="empty-log">No games or points logged yet. Start scoring and every point's exact timestamp will appear here!</div>`;
      }

      container.innerHTML = html;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-msg');
      if (toast && text) {
        text.innerText = msg;
        toast.classList.add('toast-show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
          toast.classList.remove('toast-show');
        }, 1500);
      }
    }

    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }

    window.onload = init;
  </script>
</body>
</html>
