<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Beach Volleyball Scoreboard</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: High-impact athletic typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;900&family=Teko:wght@700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            score: ['"Teko"', '"Chakra Petch"', 'Impact', 'sans-serif'],
          },
          colors: {
            neonYellow: '#FAFF00',
            neonCyan: '#00F0FF',
          },
          keyframes: {
            scorePop: {
              '0%': { transform: 'scale(0.92)' },
              '50%': { transform: 'scale(1.05)' },
              '100%': { transform: 'scale(1)' },
            },
          },
          animation: {
            scorePop: 'scorePop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
          }
        }
      }
    };
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    
    /* GIGANTIC SCORE TYPOGRAPHY (Maximal screen fill) */
    .giant-score {
      font-size: min(45vw, 90vh);
      line-height: 0.82;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
      text-shadow: 0 8px 32px rgba(0, 0, 0, 0.95);
    }
  </style>
</head>
<body class="h-full w-full bg-black text-white font-score overflow-hidden flex flex-col justify-between select-none">

  <!-- FLOATING RESET BUTTON (Top Center) -->
  <header class="fixed top-2 left-1/2 -translate-x-1/2 z-40">
    <button onclick="promptReset()" class="px-4 py-1.5 rounded-full bg-neutral-900/80 hover:bg-neutral-800 text-neutral-400 hover:text-white border border-neutral-800 shadow-2xl backdrop-blur-sm text-xs font-black font-sans uppercase tracking-widest transition active:scale-95">
      Reset Game
    </button>
  </header>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-200 bg-neutral-900/95 border border-yellow-400 text-yellow-300 px-4 py-1.5 rounded-full text-xs font-sans font-bold shadow-2xl tracking-wide">
    <span id="toast-msg">Score updated</span>
  </div>

  <!-- MAIN SCOREBOARD ARENA (Left Half Team A, Right Half Team B) -->
  <main class="h-full w-full flex flex-row overflow-hidden relative">

    <!-- TEAM A (LEFT HALF - NEON YELLOW) -->
    <section id="panel-team1" 
             class="relative flex-1 h-full flex flex-col items-center justify-center border-r-4 border-neutral-900 cursor-pointer overflow-hidden group select-none transition-colors duration-150"
             onclick="handleScreenClick('team1')">
      <!-- Glow & Visual Flash Feedback Layer -->
      <div id="glow-team1" class="absolute inset-0 bg-yellow-500/5 pointer-events-none transition duration-150"></div>
      
      <!-- Massive Score Display -->
      <div id="score-team1" class="giant-score font-bold text-neonYellow text-center tracking-tighter filter drop-shadow-[0_8px_24px_rgba(0,0,0,0.9)]">
        0
      </div>
    </section>

    <!-- TEAM B (RIGHT HALF - NEON CYAN) -->
    <section id="panel-team2" 
             class="relative flex-1 h-full flex flex-col items-center justify-center cursor-pointer overflow-hidden group select-none transition-colors duration-150"
             onclick="handleScreenClick('team2')">
      <!-- Glow & Visual Flash Feedback Layer -->
      <div id="glow-team2" class="absolute inset-0 bg-cyan-500/5 pointer-events-none transition duration-150"></div>

      <!-- Massive Score Display -->
      <div id="score-team2" class="giant-score font-bold text-neonCyan text-center tracking-tighter filter drop-shadow-[0_8px_24px_rgba(0,0,0,0.9)]">
        0
      </div>
    </section>

  </main>

  <script>
    /* ==========================================================================
       DETERMINISTIC SINGLE / DOUBLE CLICK SCORING ENGINE
       - Single Click: Exactly +1 (after 380ms)
       - Double Click (<380ms): Exactly -1 (Undo)
       - Cooldown / Debounce: Mathematically blocks cascading +/- glitches
       ========================================================================== */

    const STORAGE_KEY = 'vb_scores_simple_v1';

    // Independent scoring state machine for each team
    const teamState = {
      team1: { score: 0, timer: null, status: 'IDLE' }, // 'IDLE' | 'WAITING' | 'COOLDOWN'
      team2: { score: 0, timer: null, status: 'IDLE' }
    };

    const DOUBLE_CLICK_WINDOW_MS = 380;
    const COOLDOWN_LOCKOUT_MS = 350;

    function init() {
      loadSavedScores();
      renderScores();
      setupKeyboardListeners();
    }

    function loadSavedScores() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          teamState.team1.score = parsed.s1 || 0;
          teamState.team2.score = parsed.s2 || 0;
        }
      } catch (e) {}
    }

    function saveScores() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          s1: teamState.team1.score,
          s2: teamState.team2.score
        }));
      } catch (e) {}
    }

    function renderScores() {
      document.getElementById('score-team1').innerText = teamState.team1.score;
      document.getElementById('score-team2').innerText = teamState.team2.score;
    }

    /**
     * Core Scoring Event Handler:
     * Guarantees that each user interaction can ONLY EVER produce:
     * - Exactly +1 (single press)
     * - Exactly -1 (rapid double press)
     */
    function registerScoreEvent(team) {
      const state = teamState[team];

      // 1. If currently in cooldown lock, completely ignore key bounce or trailing clicks
      if (state.status === 'COOLDOWN') {
        return;
      }

      // 2. If a single click is already pending, this is a DOUBLE CLICK (-1 UNDO)
      if (state.status === 'WAITING') {
        // Cancel the pending +1 timer
        clearTimeout(state.timer);
        state.timer = null;

        // Perform EXACTLY ONE decrement (-1)
        state.score = Math.max(0, state.score - 1);
        saveScores();
        renderScores();
        triggerVisualFeedback(team, 'red');
        triggerHaptic(80);

        // Enter cooldown lockout to prevent any trailing 3rd/4th clicks from triggering +1
        state.status = 'COOLDOWN';
        setTimeout(() => {
          state.status = 'IDLE';
        }, COOLDOWN_LOCKOUT_MS);
        return;
      }

      // 3. FIRST CLICK (Start waiting for possible double click)
      if (state.status === 'IDLE') {
        state.status = 'WAITING';
        triggerVisualFeedback(team, 'pop');

        state.timer = setTimeout(() => {
          // SINGLE CLICK CONFIRMED (+1)
          state.score += 1;
          saveScores();
          renderScores();
          triggerHaptic(40);

          state.timer = null;
          state.status = 'COOLDOWN';
          setTimeout(() => {
            state.status = 'IDLE';
          }, 80);
        }, DOUBLE_CLICK_WINDOW_MS);
      }
    }

    /* Screen Tap Handler */
    function handleScreenClick(team) {
      registerScoreEvent(team);
    }

    /* Native Android Remote Key Handler (called from MainActivity) */
    window.handleRemoteClick = function(team) {
      registerScoreEvent(team);
    };

    /* Keyboard / Web Fallback */
    function setupKeyboardListeners() {
      window.addEventListener('keydown', (e) => {
        if (e.repeat) return; // Ignore auto-repeat keydown

        const code = e.code || e.key;
        if (['ArrowLeft', 'KeyA', 'Enter', 'PageUp', 'AudioVolumeUp'].includes(code)) {
          e.preventDefault();
          registerScoreEvent('team1');
        } else if (['ArrowRight', 'KeyB', 'Space', 'PageDown', 'AudioVolumeDown'].includes(code)) {
          e.preventDefault();
          registerScoreEvent('team2');
        } else if (code === 'KeyR') {
          promptReset();
        }
      });
    }

    /* Visual Pulse & Color Feedback */
    function triggerVisualFeedback(team, type) {
      const scoreEl = document.getElementById(`score-${team}`);
      const glowEl = document.getElementById(`glow-${team}`);

      if (scoreEl) {
        scoreEl.classList.remove('animate-scorePop');
        void scoreEl.offsetWidth; // Force reflow
        scoreEl.classList.add('animate-scorePop');
      }

      if (glowEl) {
        if (type === 'red') {
          glowEl.className = 'absolute inset-0 bg-red-600/40 pointer-events-none transition duration-150';
          setTimeout(() => {
            glowEl.className = `absolute inset-0 ${team === 'team1' ? 'bg-yellow-500/5' : 'bg-cyan-500/5'} pointer-events-none transition duration-150`;
          }, 250);
        } else {
          glowEl.className = 'absolute inset-0 bg-white/20 pointer-events-none transition duration-100';
          setTimeout(() => {
            glowEl.className = `absolute inset-0 ${team === 'team1' ? 'bg-yellow-500/5' : 'bg-cyan-500/5'} pointer-events-none transition duration-100`;
          }, 120);
        }
      }
    }

    function triggerHaptic(duration) {
      if (window.AndroidNative && window.AndroidNative.vibrate) {
        window.AndroidNative.vibrate(duration);
      } else if ('vibrate' in navigator) {
        navigator.vibrate(duration);
      }
    }

    function promptReset() {
      if (confirm("Reset score to 0 - 0?")) {
        // Clear any pending timers
        clearTimeout(teamState.team1.timer);
        clearTimeout(teamState.team2.timer);
        teamState.team1.timer = null;
        teamState.team2.timer = null;
        teamState.team1.status = 'IDLE';
        teamState.team2.status = 'IDLE';

        teamState.team1.score = 0;
        teamState.team2.score = 0;
        saveScores();
        renderScores();
        showToast("Score reset to 0 - 0");
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-msg');
      if (toast && text) {
        text.innerText = msg;
        toast.classList.remove('opacity-0');
        toast.classList.add('opacity-100');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
          toast.classList.remove('opacity-100');
          toast.classList.add('opacity-0');
        }, 1500);
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
